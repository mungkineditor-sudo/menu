<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5A44">
<title>Menu Kafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F0; --card:#FFFFFF; --ink:#15251E; --muted:#66756D; --line:#DCE3D9;
  --green:#1D5A44; --green-d:#134232; --mango:#F2A922; --danger:#B3261E;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto}

/* Header */
.hero{background:var(--green);color:#fff;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 22px;border-radius:0 0 28px 28px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.hero h1{font:800 28px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.logo{width:60px;height:60px;border-radius:18px;object-fit:cover;background:#fff;display:block}

/* Lokasi (di sheet Reservasi) */
.loc{display:flex;align-items:flex-start;gap:8px;background:#E8F0EA;border-radius:16px;padding:12px 14px;font-size:14px;color:var(--green-d);margin-bottom:8px}
.loc svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.loc a{color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* Daftar kategori (di sheet) */
.cat-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:15px 16px;margin-bottom:10px;
  border-radius:16px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:17px;text-transform:capitalize}
.cat-row small{display:block;margin-top:2px;color:var(--muted);font-weight:400;font-size:13px;text-transform:none}
.cat-row svg{width:22px;height:22px;flex:none;stroke:var(--green);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cat-row[aria-pressed="true"]{border-color:var(--green);background:#E8F0EA}

/* Daftar menu */
main{padding:6px 20px 0}
.cat-title{font:800 24px/1.15 var(--display);margin:22px 0 14px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{background:var(--card);border-radius:18px;padding:8px 8px 12px;display:flex;flex-direction:column;border:1px solid var(--line)}
.item .pic{aspect-ratio:1/1;border-radius:12px;background:#E6ECE2;overflow:hidden;display:grid;place-items:center;font-size:34px}
.item .pic img{width:100%;height:100%;object-fit:cover;display:block}
.item h3{font:600 16px/1.25 var(--body);margin:10px 4px 2px}
.item .price{margin:0 4px 10px;color:var(--green);font-weight:600}
.item .act{margin-top:auto}
.btn-add{width:100%;padding:9px 0;border-radius:999px;background:var(--green);color:#fff;font-weight:600;font-size:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#E8F0EA;border-radius:999px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:50%;background:#fff;font-size:20px;line-height:1;font-weight:600;color:var(--green)}
.stepper span{font-weight:600;min-width:24px;text-align:center}

/* Status muat */
.skel{height:220px;border-radius:18px;background:linear-gradient(90deg,#E6ECE2 25%,#F0F4ED 50%,#E6ECE2 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--muted)}
.state b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:6px}
.btn-line{margin-top:14px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--green);color:var(--green);font-weight:600}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0 auto;width:calc(100% - 24px);max-width:496px;z-index:20;
  height:64px;border-radius:32px;background:var(--green);display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;box-shadow:0 8px 24px rgba(19,66,50,.35)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:#A9CBBB;font-size:12px;font-weight:600;height:100%;justify-content:center}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:#fff}
.tab-cart{position:relative;justify-self:center;width:64px;height:64px;margin-top:-26px;border-radius:50%;background:var(--mango);color:var(--green-d);
  display:grid;place-items:center;border:5px solid var(--bg)}
.tab-cart svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--green-d);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,24,18,.5);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:520px;z-index:30;background:var(--bg);
  border-radius:26px 26px 0 0;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.sheet h2{font:800 22px var(--display);margin:0}
.x{width:38px;height:38px;border-radius:50%;background:#E6ECE2;display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.sheet .body{overflow-y:auto;padding:6px 20px 16px;flex:1}
.sheet footer{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.total{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px}
.total b{font:800 20px var(--display);color:var(--green)}
.btn-main{width:100%;padding:15px 0;border-radius:999px;background:var(--green);color:#fff;font-weight:600;font-size:16px}
.btn-main.wa{background:#1FA855}
.btn-main:disabled{opacity:.5}

/* Baris keranjang */
.line{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.line-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.line-top b{font-weight:600}
.line-top small{display:block;color:var(--muted)}
.line .stepper{flex:none;width:112px}
.line input{width:100%;margin-top:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px}

/* Form reservasi */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
.field textarea{resize:vertical;min-height:76px}
.field .bad,.field input.bad{border-color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.recap{background:#E8F0EA;border-radius:16px;padding:12px 14px;font-size:14px;color:var(--green-d);margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}.skel{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <img id="logo" class="logo" alt="Logo kafe" hidden>
    <h1 id="cafeName">Leo Caffee</h1>
  </div>
  <main id="menu" aria-live="polite"></main>
</div>

<nav class="tabbar" aria-label="Navigasi utama">
  <button class="tab" id="tabMenu" aria-current="true" aria-label="Pilih kategori menu">
    <svg viewBox="0 0 24 24"><path d="M5 3v7a2 2 0 0 0 4 0V3M7 3v18M18 3c-2.2 0-3.5 2.4-3.5 5.5S15.8 12 18 12v9"/></svg>Menu
  </button>
  <button class="tab-cart" id="tabCart" aria-label="Buka keranjang">
    <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 10.6a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.4"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></svg>
    <span class="badge" id="badge" hidden>0</span>
  </button>
  <button class="tab" id="tabRsv">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Reservasi
  </button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheetCat" role="dialog" aria-modal="true" aria-labelledby="catTitle">
  <header><h2 id="catTitle">Kategori</h2><button class="x" data-close aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></header>
  <div class="body" id="catBody"></div>
  <div style="height:calc(12px + env(safe-area-inset-bottom,0px))"></div>
</section>

<section class="sheet" id="sheetCart" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <header><h2 id="cartTitle">Keranjang</h2><button class="x" data-close aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></header>
  <div class="body" id="cartBody"></div>
  <footer id="cartFoot">
    <div class="total"><span>Total</span><b id="cartTotal">Rp0</b></div>
    <button class="btn-main" id="toRsv">Lanjut isi reservasi</button>
  </footer>
</section>

<section class="sheet" id="sheetRsv" role="dialog" aria-modal="true" aria-labelledby="rsvTitle">
  <header><h2 id="rsvTitle">Reservasi</h2><button class="x" data-close aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></header>
  <div class="body">
    <div class="field"><label for="fNama">Nama pemesan</label><input id="fNama" autocomplete="name" placeholder="Nama kamu"></div>
    <div class="row2">
      <div class="field"><label for="fTgl">Tanggal</label><input id="fTgl" type="date"></div>
      <div class="field"><label for="fJam">Jam</label><input id="fJam" type="time"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="fOrang">Jumlah orang</label><input id="fOrang" type="number" inputmode="numeric" min="1" max="50" value="2"></div>
      <div class="field"><label for="fHp">No. HP (opsional)</label><input id="fHp" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xx"></div>
    </div>
    <div class="field"><label for="fCatatan">Catatan (opsional)</label><textarea id="fCatatan" placeholder="Contoh: minta meja dekat jendela"></textarea></div>
    <div class="recap" id="recap"></div>
    <div class="loc" id="loc" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span><span id="addrText"></span> <a id="mapLink" href="#" target="_blank" rel="noopener" hidden>Buka peta</a></span>
    </div>
  </div>
  <footer>
    <div class="total"><span>Total pesanan</span><b id="rsvTotal">Rp0</b></div>
    <button class="btn-main wa" id="send">Kirim lewat WhatsApp</button>
  </footer>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
/* ====== PENGATURAN ======
   Menu dibaca dari sheet "daftar menu". Data kafe (nama, No WhatsApp, alamat, link maps, logo)
   dibaca dari sheet "main data". Nilai DEFAULT hanya cadangan kalau sheet gagal dimuat. */
const CONFIG = {
  SHEET_ID: '1AslHIh6h215Bg26Ilz1C_jJSpABqGk1725P5y_EvV-w',
  MENU_TAB: 'Sheet1',
  SETTINGS_SHEET_ID: '11ru-gvxt6jhD37XQDPllGN8gphp394eDah87p8RsGVA',
  SETTINGS_TAB: 'Sheet1',
  DEFAULT_WA: '085117017130',
  DEFAULT_NAME: 'Leo Caffee'
};

const $ = s => document.querySelector(s);
const state = { items: [], cats: [], cat: '', cart: {}, wa: CONFIG.DEFAULT_WA, cafe: CONFIG.DEFAULT_NAME };
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent, dec = decodeURIComponent;

/* ---------- Cart storage ---------- */
function saveCart(){ try{ localStorage.setItem('menu-kafe-cart', JSON.stringify(state.cart)); }catch(e){} }
function loadCart(){ try{ state.cart = JSON.parse(localStorage.getItem('menu-kafe-cart')||'{}') || {}; }catch(e){ state.cart = {}; } }

/* ---------- Google Sheet ---------- */
async function readTab(tab, id = CONFIG.SHEET_ID, headers = 1){
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&headers=${headers}&sheet=${enc(tab)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const txt = await res.text();
  const json = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
  if(json.status === 'error') throw new Error('Sheet error');
  return json.table;
}
function driveImg(link){
  if(!link) return '';
  const m = String(link).match(/\/d\/([\w-]+)/) || String(link).match(/[?&]id=([\w-]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w600` : String(link);
}
function parseMenu(table){
  const cols = table.cols || [];
  const idx = (names, fb) => { const i = cols.findIndex(c => names.includes((c.label||'').trim().toLowerCase())); return i >= 0 ? i : fb; };
  const iCat = idx(['kategori','category'],0), iName = idx(['menu','nama','nama menu'],1),
        iPrice = idx(['harga','price'],2), iImg = idx(['link image','gambar','image','foto'],3);
  let lastCat = 'Menu';
  const items = [];
  (table.rows||[]).forEach(r => {
    const c = r.c || [];
    const v = i => (c[i] && c[i].v != null) ? c[i].v : '';
    const name = String(v(iName)).trim();
    if(!name) return;
    const cat = String(v(iCat)).trim();
    if(cat) lastCat = cat;
    let price = v(iPrice);
    price = typeof price === 'number' ? price : parseInt(String(price).replace(/\D/g,''),10);
    items.push({ name, cat: lastCat, price: isNaN(price) ? 0 : price, img: driveImg(v(iImg)) });
  });
  return items;
}
function parseSettings(table){
  const raw = {};
  const put = (k, v) => {
    if(k == null || v == null || !String(k).trim()) return;
    raw[String(k).trim().toLowerCase().replace(/[_\s]+/g,' ')] = String(v).trim();
  };
  const cols = table.cols || [];
  // Kalau baris 1 terbaca sebagai judul kolom, tetap dipakai sebagai data
  if(cols[0] && cols[0].label && cols[1] && cols[1].label) put(cols[0].label, cols[1].label);
  (table.rows || []).forEach(r => { const c = r.c || []; put(c[0] && c[0].v, c[1] && c[1].v); });
  const pick = (...ks) => { for(const k of ks) if(raw[k]) return raw[k]; return ''; };
  return {
    wa: pick('no whatsapp','whatsapp','wa','no wa'),
    name: pick('nama cafe','nama kafe','nama'),
    addr: pick('alamat'),
    maps: pick('link maps','maps','peta'),
    logo: pick('logo'),
    tagline: pick('tagline')
  };
}

/* ---------- Render menu ---------- */
function showSkeleton(){
  $('#menu').innerHTML = '<div class="grid">' + '<div class="skel"></div>'.repeat(4) + '</div>';
}
function cardHTML(it){
  const q = (state.cart[it.name]||{}).qty || 0;
  const pic = it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('☕'))">` : '☕';
  const act = q
    ? `<div class="stepper"><button data-act="dec" data-k="${enc(it.name)}" aria-label="Kurangi ${esc(it.name)}">−</button><span>${q}</span><button data-act="inc" data-k="${enc(it.name)}" aria-label="Tambah ${esc(it.name)}">+</button></div>`
    : `<button class="btn-add" data-act="add" data-k="${enc(it.name)}">Tambah</button>`;
  return `<article class="item"><div class="pic">${pic}</div><h3>${esc(it.name)}</h3><p class="price">${rp(it.price)}</p><div class="act">${act}</div></article>`;
}
function renderMenu(){
  if(!state.items.length){
    $('#menu').innerHTML = '<div class="state"><b>Menu belum tersedia</b>Isi data menu di Google Sheet, lalu muat ulang halaman ini.</div>';
    return;
  }
  const c = state.cat || state.cats[0];
  $('#menu').innerHTML = `<h2 class="cat-title">${esc(c)}</h2><div class="grid">${state.items.filter(i => i.cat === c).map(cardHTML).join('')}</div>`;
}
function renderCats(){
  if(!state.cats.length){ $('#catBody').innerHTML = '<div class="state"><b>Belum ada kategori</b>Tambahkan menu di Google Sheet.</div>'; return; }
  $('#catBody').innerHTML = state.cats.map(c => {
    const n = state.items.filter(i => i.cat === c).length, on = c === state.cat;
    return `<button class="cat-row" data-cat="${enc(c)}" aria-pressed="${on}"><span>${esc(c)}<small>${n} menu</small></span>${on ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : ''}</button>`;
  }).join('');
}

/* ---------- Cart logic ---------- */
function cartList(){ return Object.values(state.cart); }
function cartTotal(){ return cartList().reduce((s,i) => s + i.price * i.qty, 0); }
function cartCount(){ return cartList().reduce((s,i) => s + i.qty, 0); }
function changeQty(name, d){
  const it = state.items.find(i => i.name === name) || state.cart[name];
  if(!it) return;
  const cur = state.cart[name] || { name, price: it.price, qty: 0, note: '' };
  cur.qty += d;
  if(cur.qty <= 0) delete state.cart[name]; else state.cart[name] = cur;
  saveCart(); refresh();
  if(d > 0 && cur.qty === 1) toast(`${name} ditambahkan`);
}
function refresh(){
  const n = cartCount();
  $('#badge').textContent = n; $('#badge').hidden = n === 0;
  renderMenu(); renderCart(); renderRecap();
}
function renderCart(){
  const list = cartList();
  const empty = !list.length;
  $('#cartFoot').style.display = empty ? 'none' : '';
  $('#cartTotal').textContent = rp(cartTotal());
  if(empty){
    $('#cartBody').innerHTML = '<div class="state"><b>Keranjang masih kosong</b>Pilih menu, lalu tekan Tambah.<br><button class="btn-line" data-close>Lihat menu</button></div>';
    return;
  }
  $('#cartBody').innerHTML = list.map(i => `
    <div class="line">
      <div class="line-top"><div><b>${esc(i.name)}</b><small>${rp(i.price)} × ${i.qty} = ${rp(i.price*i.qty)}</small></div>
        <div class="stepper"><button data-act="dec" data-k="${enc(i.name)}" aria-label="Kurangi ${esc(i.name)}">−</button><span>${i.qty}</span><button data-act="inc" data-k="${enc(i.name)}" aria-label="Tambah ${esc(i.name)}">+</button></div></div>
      <input data-note="${enc(i.name)}" value="${esc(i.note||'')}" placeholder="Catatan, misalnya tidak pedas" maxlength="120" aria-label="Catatan untuk ${esc(i.name)}">
    </div>`).join('');
}
function renderRecap(){
  const n = cartCount();
  $('#rsvTotal').textContent = rp(cartTotal());
  $('#recap').textContent = n ? `${n} porsi dari ${cartList().length} menu di keranjang.` : 'Keranjang masih kosong. Tambahkan menu sebelum mengirim.';
}

/* ---------- Sheets ---------- */
let openSheet = null;
function openIt(id){
  closeIt(true);
  openSheet = id;
  $(id).classList.add('on'); $('#scrim').classList.add('on');
  if(id === '#sheetCat') $('#tabMenu').setAttribute('aria-current','true'); else $('#tabMenu').removeAttribute('aria-current');
  document.body.style.overflow = 'hidden';
}
function closeIt(keep){
  ['#sheetCat','#sheetCart','#sheetRsv'].forEach(s => $(s).classList.remove('on'));
  $('#scrim').classList.remove('on');
  document.body.style.overflow = '';
  openSheet = null;
  if(!keep) $('#tabMenu').setAttribute('aria-current','true');
}
let tt;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- WhatsApp ---------- */
function normPhone(p){
  let d = String(p).replace(/\D/g,'');
  if(d.startsWith('0')) d = '62' + d.slice(1);
  else if(d.startsWith('8')) d = '62' + d;
  return d;
}
function buildMessage(f){
  const tgl = new Date(f.tgl + 'T00:00').toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const lines = [
    '*RESERVASI & PESANAN*',
    `*${state.cafe}*`,
    '',
    `Nama: ${f.nama}`,
    `Tanggal: ${tgl}`,
    `Jam: ${f.jam.replace(':','.')}`,
    `Jumlah orang: ${f.orang}`
  ];
  if(f.hp) lines.push(`No. HP: ${f.hp}`);
  lines.push('', '*Pesanan:*');
  cartList().forEach((i,n) => {
    lines.push(`${n+1}. ${i.name} x${i.qty} = ${rp(i.price*i.qty)}`);
    if(i.note) lines.push(`   Catatan: ${i.note}`);
  });
  lines.push('', `*Total: ${rp(cartTotal())}*`);
  if(f.catatan) lines.push('', `Catatan reservasi: ${f.catatan}`);
  return lines.join('\n');
}
function send(){
  const f = { nama: $('#fNama').value.trim(), tgl: $('#fTgl').value, jam: $('#fJam').value,
    orang: parseInt($('#fOrang').value,10) || 0, hp: $('#fHp').value.trim(), catatan: $('#fCatatan').value.trim() };
  ['#fNama','#fTgl','#fJam','#fOrang'].forEach(s => $(s).classList.remove('bad'));
  let bad = false;
  if(!f.nama){ $('#fNama').classList.add('bad'); bad = true; }
  if(!f.tgl){ $('#fTgl').classList.add('bad'); bad = true; }
  if(!f.jam){ $('#fJam').classList.add('bad'); bad = true; }
  if(f.orang < 1){ $('#fOrang').classList.add('bad'); bad = true; }
  if(bad){ toast('Isi nama, tanggal, jam, dan jumlah orang dulu.'); return; }
  if(!cartCount()){ toast('Keranjang masih kosong. Tambahkan menu dulu.'); return; }
  try{ localStorage.setItem('menu-kafe-profil', JSON.stringify({ nama:f.nama, hp:f.hp })); }catch(e){}
  const url = `https://wa.me/${normPhone(state.wa)}?text=${enc(buildMessage(f))}`;
  if(!window.open(url, '_blank')) location.href = url;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const cat = e.target.closest('[data-cat]');
  if(cat){ state.cat = dec(cat.dataset.cat); renderMenu(); renderCats(); closeIt(); window.scrollTo({ top:0 }); return; }
  const act = e.target.closest('[data-act]');
  if(act){ const k = dec(act.dataset.k); changeQty(k, act.dataset.act === 'dec' ? -1 : 1); return; }
  if(e.target.closest('[data-close]') || e.target === $('#scrim')) closeIt();
});
document.addEventListener('input', e => {
  const n = e.target.dataset && e.target.dataset.note;
  if(n){ const k = dec(n); if(state.cart[k]){ state.cart[k].note = e.target.value.trim(); saveCart(); } }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && openSheet) closeIt(); });
$('#tabMenu').onclick = () => { if(openSheet === '#sheetCat') closeIt(); else { renderCats(); openIt('#sheetCat'); } };
$('#tabCart').onclick = () => openIt('#sheetCart');
$('#tabRsv').onclick = () => openIt('#sheetRsv');
$('#toRsv').onclick = () => openIt('#sheetRsv');
$('#send').onclick = send;

/* ---------- Init ---------- */
async function init(){
  loadCart();
  try{ const p = JSON.parse(localStorage.getItem('menu-kafe-profil')||'{}'); $('#fNama').value = p.nama||''; $('#fHp').value = p.hp||''; }catch(e){}
  const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  $('#fTgl').min = today.toISOString().slice(0,10);
  $('#cafeName').textContent = state.cafe;
  showSkeleton();

  const [menuRes, setRes] = await Promise.allSettled([ readTab(CONFIG.MENU_TAB), readTab(CONFIG.SETTINGS_TAB, CONFIG.SETTINGS_SHEET_ID, 0) ]);

  if(setRes.status === 'fulfilled'){
    const t = parseSettings(setRes.value);
    if(t.wa) state.wa = t.wa;
    if(t.name){ state.cafe = t.name; $('#cafeName').textContent = t.name; document.title = t.name; }
    if(t.addr){ $('#addrText').textContent = t.addr; $('#loc').hidden = false; }
    if(t.maps && /^https?:\/\//i.test(t.maps)){ $('#mapLink').href = t.maps; $('#mapLink').hidden = false; $('#loc').hidden = false; }
    const logoUrl = driveImg(t.logo);
    if(logoUrl){
      const lg = $('#logo');
      lg.onerror = () => { lg.hidden = true; };
      lg.referrerPolicy = 'no-referrer';
      lg.src = logoUrl; lg.hidden = false;
    }
  }

  if(menuRes.status !== 'fulfilled'){
    $('#menu').innerHTML = '<div class="state"><b>Menu gagal dimuat</b>Cek koneksi internet dan pastikan Google Sheet dibagikan ke "Siapa saja yang memiliki link".<br><button class="btn-line" onclick="init()">Coba lagi</button></div>';
    return;
  }
  state.items = parseMenu(menuRes.value);
  state.cats = [...new Set(state.items.map(i => i.cat))];
  state.cat = state.cats[0] || '';   // halaman awal = kategori paling atas di sheet

  // Sinkronkan keranjang tersimpan dengan data terbaru dari sheet
  Object.keys(state.cart).forEach(k => {
    const it = state.items.find(i => i.name === k);
    if(!it) delete state.cart[k]; else state.cart[k].price = it.price;
  });
  saveCart();
  refresh();
  renderCats();
}
init();
</script>
