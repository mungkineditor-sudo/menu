<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Viewer - Kamar Pas Lt 2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
    font-family: Arial, Helvetica, sans-serif;
  }
  #canvas-container {
    width: 100%;
    height: 100%;
    position: relative;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #canvas-container canvas {
    touch-action: none;
    display: block;
  }
  #settings-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    flex-direction: row;
    gap: 10px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 10px 12px;
    z-index: 8;
    color: #fff;
    font-size: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  .setting-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .setting-row label {
    font-weight: bold;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .setting-row select {
    -webkit-appearance: none;
    appearance: none;
    padding: 6px 24px 6px 10px;
    border-radius: 8px;
    border: none;
    background-color: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 12px;
    outline: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 6px center;
    background-size: 16px;
  }
  .setting-row select:active {
    background-color: rgba(255,255,255,0.3);
  }
  .setting-row select option {
    color: #000;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stepper button {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  .stepper button:active {
    background: rgba(255,255,255,0.35);
  }
  .stepper .stepper-value {
    min-width: 32px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: #4da6ff;
  }
  #mobile-controls {
    position: absolute;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 8;
  }
  #mobile-controls button {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #mobile-controls button:active {
    background: rgba(255,255,255,0.35);
  }
  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: 16px;
    text-align: center;
    z-index: 10;
  }
  #loading .bar-bg {
    width: 220px;
    height: 6px;
    background: #333;
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
  }
  #loading .bar-fill {
    width: 0%;
    height: 100%;
    background: #4da6ff;
    transition: width 0.15s ease-out;
  }
  #info {
    position: absolute;
    bottom: 12px;
    left: 12px;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 8px 12px;
    border-radius: 6px;
    z-index: 5;
    line-height: 1.5;
  }
  #error {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff6b6b;
    font-size: 14px;
    text-align: center;
    max-width: 80%;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="canvas-container">
  <div id="loading">
    Memuat model 3D...
    <div class="bar-bg"><div class="bar-fill" id="bar-fill"></div></div>
  </div>
  <div id="error"></div>
  <div id="settings-panel">
    <div class="setting-row">
      <label>Camera Speed</label>
      <div class="stepper">
        <button id="speed-minus" aria-label="Kurangi kecepatan">−</button>
        <span class="stepper-value" id="speed-value">0.35</span>
        <button id="speed-plus" aria-label="Tambah kecepatan">+</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="quality-select">Kualitas</label>
      <select id="quality-select">
        <option value="0" selected>Potato</option>
        <option value="1">Low</option>
        <option value="2">Medium</option>
        <option value="3">High</option>
        <option value="4">Super High</option>
      </select>
    </div>
  </div>
  <div id="info">
    🖱️ Klik/1 jari geser: putar kamera<br>
    🖲️ Scroll/cubit 2 jari: zoom in/out<br>
    🖱️ Klik kanan / 2 jari geser: pan
  </div>
  <div id="mobile-controls">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="reset-view" aria-label="Reset view" style="font-size:16px;">⟳</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---- Ganti nama file di bawah ini jika nama model kamu berbeda ----
const MODEL_PATH = 'kamar_pas_lt_2_ver_4.glb';
// ---------------------------------------------------------------

// ---- Pengaturan kecepatan kontrol kamera (silakan disesuaikan) ----
const ROTATE_SPEED = 0.35;   // makin kecil = putar kamera makin pelan/halus
const ZOOM_SPEED   = 0.8;    // kecepatan zoom scroll/pinch
const PAN_SPEED    = 0.5;    // kecepatan geser (pan)
// ---------------------------------------------------------------

const container = document.getElementById('canvas-container');
const loadingEl = document.getElementById('loading');
const barFill = document.getElementById('bar-fill');
const errorEl = document.getElementById('error');

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

// Camera
const camera = new THREE.PerspectiveCamera(
  50,
  container.clientWidth / container.clientHeight,
  0.01,
  1000
);
camera.position.set(5, 5, 5);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7.5);
dirLight.castShadow = true;
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
dirLight2.position.set(-5, 5, -7.5);
scene.add(dirLight2);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemiLight);

// Controls - rotate, zoom, pan
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = true;
controls.zoomSpeed = ZOOM_SPEED;
controls.enableRotate = true;
controls.rotateSpeed = ROTATE_SPEED;
controls.enablePan = true;
controls.minDistance = 0.1;
controls.maxDistance = 500;
controls.target.set(0, 0, 0);

// Konfigurasi gestur sentuh secara eksplisit agar responsif di HP/tablet
controls.touches = {
  ONE: THREE.TOUCH.ROTATE,      // 1 jari = putar
  TWO: THREE.TOUCH.DOLLY_PAN    // 2 jari = cubit untuk zoom + geser
};
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN
};
controls.panSpeed = PAN_SPEED;
renderer.domElement.style.touchAction = 'none';

// Panel pengaturan (pojok kiri atas) - Camera Speed (stepper) & Kualitas (dropdown)
const speedValueEl = document.getElementById('speed-value');
const qualitySelectEl = document.getElementById('quality-select');

const SPEED_STEP = 0.1;
const SPEED_MIN = 0.05;
const SPEED_MAX = 1.5;

function setRotateSpeed(value) {
  const clamped = THREE.MathUtils.clamp(value, SPEED_MIN, SPEED_MAX);
  controls.rotateSpeed = clamped;
  speedValueEl.textContent = clamped.toFixed(2);
}
setRotateSpeed(ROTATE_SPEED);

document.getElementById('speed-plus').addEventListener('click', () => {
  setRotateSpeed(controls.rotateSpeed + SPEED_STEP);
});
document.getElementById('speed-minus').addEventListener('click', () => {
  setRotateSpeed(controls.rotateSpeed - SPEED_STEP);
});

// Level kualitas: Potato - Low - Medium - High - Super High
const QUALITY_LEVELS = [
  { name: 'Potato',     pixelRatio: 0.5, shadows: false, shadowMapSize: 512,  shadowType: THREE.BasicShadowMap },
  { name: 'Low',        pixelRatio: 1,   shadows: false, shadowMapSize: 512,  shadowType: THREE.BasicShadowMap },
  { name: 'Medium',     pixelRatio: 1.5, shadows: true,  shadowMapSize: 1024, shadowType: THREE.PCFShadowMap },
  { name: 'High',       pixelRatio: 2,   shadows: true,  shadowMapSize: 2048, shadowType: THREE.PCFSoftShadowMap },
  { name: 'Super High', pixelRatio: 3,   shadows: true,  shadowMapSize: 4096, shadowType: THREE.PCFSoftShadowMap },
];

function applyQuality(index) {
  const level = QUALITY_LEVELS[index];

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, level.pixelRatio));
  renderer.shadowMap.enabled = level.shadows;
  renderer.shadowMap.type = level.shadowType;

  dirLight.castShadow = level.shadows;
  dirLight.shadow.mapSize.width = level.shadowMapSize;
  dirLight.shadow.mapSize.height = level.shadowMapSize;
  if (dirLight.shadow.map) {
    dirLight.shadow.map.dispose();
    dirLight.shadow.map = null;
  }
}
applyQuality(parseInt(qualitySelectEl.value, 10));
qualitySelectEl.addEventListener('change', (e) => applyQuality(parseInt(e.target.value, 10)));

// Tombol zoom manual untuk mobile (lebih mudah dari pinch di sebagian browser)
function zoomByFactor(factor) {
  const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
  let distance = offset.length() * factor;
  distance = THREE.MathUtils.clamp(distance, controls.minDistance, controls.maxDistance);
  offset.setLength(distance);
  camera.position.copy(controls.target).add(offset);
  controls.update();
}
document.getElementById('zoom-in').addEventListener('click', () => zoomByFactor(0.8));
document.getElementById('zoom-out').addEventListener('click', () => zoomByFactor(1.25));
let initialCameraPos = null;
document.getElementById('reset-view').addEventListener('click', () => {
  if (initialCameraPos) {
    camera.position.copy(initialCameraPos);
    controls.target.set(0, 0, 0);
    controls.update();
  }
});

// Load model
const loader = new GLTFLoader();

loader.load(
  MODEL_PATH,
  (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Auto-center & auto-frame kamera berdasarkan ukuran model
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.x -= center.x;
    model.position.y -= center.y;
    model.position.z -= center.z;

    scene.add(model);

    const maxDim = Math.max(size.x, size.y, size.z);
    const fitDistance = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
    const cameraDistance = fitDistance * 1.6;

    camera.position.set(cameraDistance, cameraDistance * 0.7, cameraDistance);
    initialCameraPos = camera.position.clone();
    camera.near = maxDim / 1000;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.minDistance = maxDim * 0.05;
    controls.maxDistance = maxDim * 10;
    controls.update();

    loadingEl.style.display = 'none';
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const percent = (xhr.loaded / xhr.total) * 100;
      barFill.style.width = percent.toFixed(0) + '%';
    }
  },
  (err) => {
    console.error('Gagal memuat model:', err);
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.innerHTML =
      'Gagal memuat file model.<br>Pastikan file <b>' + MODEL_PATH +
      '</b> berada di folder yang sama dengan index.html, lalu buka halaman ini lewat server (bukan file:// langsung).';
  }
);

// Resize handling
function updateSize() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}
window.addEventListener('resize', updateSize);
// Beberapa browser mobile telat update ukuran tepat saat rotasi,
// jadi dipanggil lagi sedikit setelah event orientationchange
window.addEventListener('orientationchange', () => {
  setTimeout(updateSize, 100);
  setTimeout(updateSize, 400);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
